train:
  _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  offline_dataset_dirs:
    - ${oc.env:RP_DATA_ROOT}/real_robot_data/bread/lerobot-toaster-right
    #- ${oc.env:RP_DATA_ROOT}/real_robot_data/bread/lerobot-toaster-right_var
    - ${oc.env:RP_DATA_ROOT}/real_robot_data/bread/lerobot-toaster-right-ext
    - ${oc.env:RP_DATA_ROOT}/real_robot_data/bread/pick-bread-dagger
    - ${oc.env:RP_DATA_ROOT}/real_robot_data/bread/lerobot-toaster-right-0805
    - ${oc.env:RP_DATA_ROOT}/real_robot_data/bread/toaster_right_fastwam_dagger1
    - ${oc.env:RP_DATA_ROOT}/real_robot_data/bread/toaster_right_fastwam_dagger2
  online_dataset_dirs: 
    # - ${oc.env:RP_DATA_ROOT}/real_robot_data/bread/toaster_right_openpi_dagger1 dirty data
    # - ${oc.env:RP_DATA_ROOT}/real_robot_data/bread/toaster_right_fastwam_dagger1
    # - ${oc.env:RP_DATA_ROOT}/real_robot_data/bread/toaster_right_fastwam_dagger2
    - ${oc.env:RP_DATA_ROOT}/real_robot_data/bread/toaster_right_fastwam_dagger3
  dataset_dirs: ${data.train.offline_dataset_dirs}
  shape_meta:
    images:
      - key: robot0_agentview_left
        raw_shape: [3, 224, 224]
        shape: [3, 224, 224]
      - key: robot0_eye_in_hand
        raw_shape: [3, 224, 224]
        shape: [3, 224, 224]
    action:
      - key: default
        raw_shape: 7
        shape: 7
    state:
      - key: default
        raw_shape: 8
        shape: 8
  num_frames: 33
  global_sample_stride: 1
  action_video_freq_ratio: 4
  video_size: [224, 448]
  camera_key: null
  val_set_proportion: 0.0
  is_training_set: true
  online_filter_denoise_step_lt_max: true
  online_denoise_step_max: null
  skip_padding_as_possible: false
  concat_multi_camera: "horizontal"
  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 2
    action_output_dim: 7
    proprio_output_dim: 8
    delta_action_dim_mask:
      default: [true, true, true, true, true, true, false]

    action_state_transforms: null
    use_stepwise_action_norm: false
    norm_default_mode: min/max
    norm_exception_mode: null

    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign

    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
  text_embedding_cache_dir: ${dataset_sibling_cache:${data.train.offline_dataset_dirs},text_embeds_cache/fastwam}
  context_len: 128
